# DinoFactAdventures Factory — Configuration
# Copy this to config.yaml and customize.

# Seed idea for topic generation
idea: "fun dinosaur facts for kids"

# Channel settings
channel_name: "DinoFactAdventures"
audience: "kids ages 4-8"
tone: "cheerful, educational, friendly"

# Batch settings
number_of_shorts: 5
target_length_seconds: 45
scenes_per_short: 6

# Visual style (used in image prompts)
visual_style: "cute 3D cartoon, bright colors, friendly dinosaurs"

# Output
output_dir: "output"

# Providers — set to "placeholder" to skip API calls
# llm_provider options:   openai, placeholder
# image_provider options: openai, placeholder
# voice_provider options: elevenlabs, openai, placeholder
llm_provider: openai
image_provider: openai
voice_provider: elevenlabs

# OpenAI settings
openai_model: "gpt-4o-mini"
openai_image_model: "gpt-image-1"
narrator_voice: "alloy"   # used only if voice_provider is openai

# ElevenLabs settings
# voice_id: leave blank to use the default (George — friendly kids narrator)
# Full list: https://api.elevenlabs.io/v1/voices
elevenlabs_voice_id: ""
elevenlabs_model: "eleven_turbo_v2_5"

# Feature toggles
image_generation_enabled: true
voice_generation_enabled: true
video_generation_enabled: true
include_captions: true
youtube_metadata_enabled: true

# Optional background music file path
background_music_path: ""
